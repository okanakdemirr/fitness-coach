<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0c10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitCoach" />
  <meta name="description" content="FitCoach - Your personal fitness coach with timers, workout logging, and progress tracking" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>FitCoach</title>
  <script>
    // Apply the saved theme before first paint to avoid a dark/light flash
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('fitcoach_settings') || '{}');
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f8');
      } catch (e) {}
    })();
  </script>
  <style>
    /* Critical inline CSS – guarantees styled first paint even if external CSS/JS fail to load.
       Keep tokens in sync with src/styles/main.css */
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg-primary:#0b0c10;--bg-secondary:#15171d;--bg-tertiary:#1e2129;--bg-hover:#262a33;--bg-elevated:#181a21;--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.13);--accent:#c6f24e;--accent-ink:#c6f24e;--on-accent:#0b0c10;--accent-dim:rgba(198,242,78,.13);--accent-secondary:#8b7cff;--danger:#ff5d6c;--danger-dim:rgba(255,93,108,.14);--warning:#ffb547;--warning-dim:rgba(255,181,71,.14);--success:#4ade80;--text-primary:#f4f5f7;--text-secondary:#a8adb9;--text-muted:#80858f;--glass:rgba(11,12,16,.78);--radius:16px;--radius-sm:10px;--radius-lg:22px;--nav-height:68px;--header-height:56px;--font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color-scheme:dark}
    [data-theme="light"]{--bg-primary:#f4f5f8;--bg-secondary:#fff;--bg-tertiary:#eef0f4;--bg-hover:#e5e8ee;--bg-elevated:#fff;--border:rgba(16,18,24,.08);--border-strong:rgba(16,18,24,.15);--accent:#b8ec3a;--accent-ink:#4a7a00;--on-accent:#10140a;--accent-dim:rgba(110,170,0,.13);--accent-secondary:#6a5cf0;--danger:#e5484d;--danger-dim:rgba(229,72,77,.11);--warning:#c77c00;--warning-dim:rgba(217,138,0,.13);--success:#2f9e44;--text-primary:#111318;--text-secondary:#4b505c;--text-muted:#6b7080;--glass:rgba(244,245,248,.82);color-scheme:light}
    html{height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none}
    body{font-family:var(--font);font-size:15px;line-height:1.45;background:var(--bg-primary);color:var(--text-primary);min-height:100%;overflow-x:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;background:none;border:none}
    a{color:inherit;text-decoration:none}
    #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
    #app-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:calc(var(--header-height) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) calc(16px + env(safe-area-inset-right,0px)) 0 calc(16px + env(safe-area-inset-left,0px));background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--border)}
    .header-brand{display:flex;align-items:center;gap:10px}
    .header-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
    .header-title{font-size:19px;font-weight:800;letter-spacing:-.5px;color:var(--text-primary)}
    .header-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--text-secondary)}
    #page-content{flex:1;padding:12px calc(16px + env(safe-area-inset-right,0px)) calc(var(--nav-height) + env(safe-area-inset-bottom,0px) + 24px) calc(16px + env(safe-area-inset-left,0px));max-width:640px;width:100%;margin:0 auto}
    #bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-around;height:calc(var(--nav-height) + env(safe-area-inset-bottom,0px));padding:0 calc(8px + env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) calc(8px + env(safe-area-inset-left,0px));background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--border);transform:translateZ(0)}
    .nav-item{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:.1px}
    .nav-icon-wrap{display:grid;place-items:center;width:52px;height:30px;border-radius:999px}
    .nav-icon{width:22px;height:22px}
    .nav-item.active{color:var(--text-primary)}
    .nav-item.active .nav-icon-wrap{background:var(--accent-dim);color:var(--accent-ink)}
    .hidden{display:none!important}
    #modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none}
    #modal-overlay.visible{opacity:1;pointer-events:auto}
    .page-title{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
    .section-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
    .empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
    .card{display:block;background:var(--bg-secondary);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
    .btn-primary{background:var(--accent);color:var(--on-accent)}
    .btn-secondary{background:var(--bg-tertiary);color:var(--text-primary)}
    .btn-block{width:100%}
  </style>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <a href="#/" class="header-brand" aria-label="FitCoach home">
        <span class="header-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
        </span>
        <span class="header-title">FitCoach</span>
      </a>
      <a href="#/settings" class="header-btn nav-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </header>
    <main id="page-content" role="main"></main>
    <nav id="bottom-nav" aria-label="Main navigation">
      <a href="#/" class="nav-item" data-page="dashboard">
        <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>
        <span>Home</span>
      </a>
      <a href="#/workout" class="nav-item" data-page="workout">
        <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span>
        <span>Workout</span>
      </a>
      <a href="#/timer" class="nav-item" data-page="timer">
        <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6M12 2v3"/></svg></span>
        <span>Timer</span>
      </a>
      <a href="#/history" class="nav-item" data-page="history">
        <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/></svg></span>
        <span>Progress</span>
      </a>
      <a href="#/tools" class="nav-item" data-page="tools">
        <span class="nav-icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>
        <span>Tools</span>
      </a>
    </nav>
  </div>
  <div id="modal-overlay" class="hidden" aria-hidden="true"></div>
  <div id="toast-container" aria-live="polite"></div>
  <noscript>
    <div style="text-align:center;padding:40px 20px;color:#a8adb9">
      <p style="font-size:18px;font-weight:700;margin-bottom:8px">JavaScript Required</p>
      <p style="font-size:14px">Please enable JavaScript to use FitCoach.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Self-healing: handles stale service worker cache serving old asset hashes.
    // main.js sets __FITCOACH_LOADED after the router renders, so we only
    // intervene when the JS module genuinely failed to load.
    (function() {
      // When a new SW takes control (skipWaiting + clientsClaim), auto-reload
      // so the page gets fresh assets. This works even if main.js failed to load.
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (refreshing) return;
          refreshing = true;
          location.reload();
        });
      }

      function clearCachesAndReload() {
        var p = Promise.resolve();
        if ('caches' in window) {
          p = caches.keys().then(function(names) {
            return Promise.all(names.map(function(k) { return caches.delete(k); }));
          });
        }
        return p.then(function() {
          if ('serviceWorker' in navigator) {
            return navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            });
          }
        }).then(function() {
          // Cache-bust the reload so the browser HTTP cache is bypassed
          var url = location.href.split('?')[0] + '?_fc=' + Date.now();
          location.replace(url);
        });
      }

      window.addEventListener('load', function() {
        // Shorter timeout — 3 seconds is plenty for module loading
        setTimeout(function() {
          if (window.__FITCOACH_LOADED) return;
          var content = document.getElementById('page-content');
          if (!content || content.children.length > 0) return;

          // Check if we already tried auto-recovery on this page load
          var params = new URLSearchParams(location.search);
          if (params.has('_fc')) {
            // Auto-recovery already attempted — show manual recovery UI
            content.innerHTML = '<div style="text-align:center;padding:48px 24px;color:#a8adb9">' +
              '<p style="font-size:18px;font-weight:700;margin-bottom:12px;color:#ff5d6c">App failed to load</p>' +
              '<p style="font-size:14px;margin-bottom:20px">Tap below to clear cache and try again.</p>' +
              '<button id="fc-recovery-btn" style="padding:12px 24px;background:#c6f24e;color:#0b0c10;border:none;border-radius:12px;font-weight:600;cursor:pointer;font-size:15px;position:relative;z-index:10">Clear Cache &amp; Reload</button></div>';
            document.getElementById('fc-recovery-btn').addEventListener('click', function() {
              clearCachesAndReload();
            });
            // Also respond to touchend for better mobile reliability
            document.getElementById('fc-recovery-btn').addEventListener('touchend', function(e) {
              e.preventDefault();
              clearCachesAndReload();
            });
          } else {
            // First failure — auto-clear caches and reload silently
            clearCachesAndReload();
          }
        }, 3000);
      });
    })();
  </script>
</body>
</html>
