<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="FitCoach - Your personal fitness coach with timers, workout logging, and progress tracking" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>FitCoach</title>
  <style>
    /* Critical inline CSS – guarantees styled first paint even if external CSS/JS fail to load */
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg-primary:#0f0f1a;--bg-secondary:#1a1a2e;--bg-tertiary:#252542;--bg-hover:#2d2d50;--accent:#00d4aa;--accent-dim:rgba(0,212,170,.12);--accent-secondary:#667eea;--text-primary:#e8e8f0;--text-secondary:#b8b8cc;--text-muted:#8a8a9e;--border:#2d2d4a;--danger:#ff6b6b;--danger-dim:rgba(255,107,107,.12);--warning:#ffd93d;--warning-dim:rgba(255,217,61,.12);--success:#00d4aa;--nav-height:72px;--header-height:56px;--radius:12px;--radius-sm:8px;--radius-lg:16px;--shadow:0 2px 8px rgba(0,0,0,.3);--transition:.2s ease}
    [data-theme="light"]{--bg-primary:#f5f5f7;--bg-secondary:#fff;--bg-tertiary:#e8e8ec;--bg-hover:#dddde3;--text-primary:#1a1a2e;--text-secondary:#4a4a5e;--text-muted:#8a8a9e;--border:#d0d0da;--shadow:0 2px 8px rgba(0,0,0,.08)}
    html{height:100%;-webkit-text-size-adjust:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
    #app-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:calc(var(--header-height) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:var(--bg-primary);border-bottom:1px solid var(--border)}
    .header-title{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.5px}
    .header-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--bg-tertiary);border:none;color:var(--text-secondary);cursor:pointer;text-decoration:none;transition:background var(--transition)}
    #page-content{flex:1;padding:20px 16px calc(var(--nav-height) + env(safe-area-inset-bottom,0px) + 16px);max-width:600px;width:100%;margin:0 auto}
    #bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-around;height:calc(var(--nav-height) + env(safe-area-inset-bottom,0px));padding:0 0 env(safe-area-inset-bottom,0px);background:var(--bg-secondary);border-top:1px solid var(--border)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;color:var(--text-muted);text-decoration:none;font-size:11px;font-weight:500;transition:color var(--transition);-webkit-tap-highlight-color:transparent}
    .nav-item.active,.nav-item[aria-current="page"]{color:var(--accent)}
    .nav-icon{width:24px;height:24px}
    .hidden{display:none!important}
    #modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none}
    #modal-overlay.visible{opacity:1;pointer-events:auto}
    #modal-overlay.hidden{display:none}
    .page-title{font-size:24px;font-weight:800;margin-bottom:20px;letter-spacing:-.5px}
    .section-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
    .empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
    .empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.5}
    .card{background:var(--bg-secondary);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
    .btn-primary{background:var(--accent);color:#0f0f1a}
    .btn-secondary{background:var(--bg-tertiary);color:var(--text-primary)}
    .btn-ghost{background:transparent;color:var(--text-secondary);padding:8px 16px}
    .btn-sm{padding:8px 16px;font-size:13px}
    .btn-block{width:100%}
    .toast{position:fixed;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--bg-tertiary);color:var(--text-primary);border-radius:20px;font-size:14px;font-weight:500;z-index:300;box-shadow:var(--shadow);white-space:nowrap}
    @keyframes page-fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    #page-content>*{animation:page-fade-in .2s ease}
  </style>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1 class="header-title">FitCoach</h1>
      <a href="#/settings" class="header-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
    </header>
    <main id="page-content" role="main"></main>
    <nav id="bottom-nav" role="navigation" aria-label="Main navigation">
      <a href="#/" class="nav-item" data-page="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="#/workout" class="nav-item" data-page="workout">
        <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6.5 6.5h11M6 12h12M6.5 17.5h11"/>
          <rect x="2" y="4" width="4" height="16" rx="1"/>
          <rect x="18" y="4" width="4" height="16" rx="1"/>
        </svg>
        <span>Workout</span>
      </a>
      <a href="#/timer" class="nav-item" data-page="timer">
        <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="13" r="9"/>
          <polyline points="12 9 12 13 15 14"/>
          <path d="M9 2h6M12 2v2"/>
        </svg>
        <span>Timer</span>
      </a>
      <a href="#/history" class="nav-item" data-page="history">
        <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 8v4l3 3"/>
          <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/>
        </svg>
        <span>History</span>
      </a>
      <a href="#/tools" class="nav-item" data-page="tools">
        <svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <span>Tools</span>
      </a>
    </nav>
  </div>
  <div id="modal-overlay" class="hidden" aria-hidden="true"></div>
  <div id="toast-container" role="status" aria-live="polite"></div>
  <noscript>
    <div style="text-align:center;padding:40px 20px;color:#b8b8cc">
      <p style="font-size:18px;font-weight:700;margin-bottom:8px">JavaScript Required</p>
      <p style="font-size:14px">Please enable JavaScript to use FitCoach.</p>
    </div>
  </noscript>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Self-healing: if JS fails to render the app (e.g. stale SW cache),
    // clear all caches, unregister SW, and reload.
    // Retries up to 3 times with increasing delays.
    window.addEventListener('load', function() {
      setTimeout(function() {
        var content = document.getElementById('page-content');
        if (content && content.children.length === 0) {
          var attempts = parseInt(sessionStorage.getItem('fitcoach-recovery') || '0', 10);
          if (attempts >= 3) {
            // After 3 failed attempts, show manual recovery UI
            content.innerHTML = '<div style="text-align:center;padding:48px 24px;color:#b8b8cc">' +
              '<p style="font-size:18px;font-weight:700;margin-bottom:12px;color:#ff6b6b">App failed to load</p>' +
              '<p style="font-size:14px;margin-bottom:20px">Please clear your browser cache or reinstall the app.</p>' +
              '<button id="fc-recovery-btn" style="padding:12px 24px;background:#00d4aa;color:#0f0f1a;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:15px">Clear Cache &amp; Reload</button></div>';
            document.getElementById('fc-recovery-btn').addEventListener('click', function() {
              sessionStorage.removeItem('fitcoach-recovery');
              var p = Promise.resolve();
              if ('caches' in window) {
                p = caches.keys().then(function(n) { return Promise.all(n.map(function(k) { return caches.delete(k); })); });
              }
              p.then(function() {
                if ('serviceWorker' in navigator) {
                  return navigator.serviceWorker.getRegistrations().then(function(r) {
                    return Promise.all(r.map(function(reg) { return reg.unregister(); }));
                  });
                }
              }).then(function() { location.reload(); });
            });
            return;
          }
          sessionStorage.setItem('fitcoach-recovery', String(attempts + 1));
          var clearAndReload = function() {
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).then(function() {
                if ('serviceWorker' in navigator) {
                  return navigator.serviceWorker.getRegistrations().then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister(); }));
                  });
                }
              }).then(function() { window.location.reload(); });
            } else {
              window.location.reload();
            }
          };
          clearAndReload();
        } else if (content && content.children.length > 0) {
          sessionStorage.removeItem('fitcoach-recovery');
        }
      }, 2000);
    });
  </script>
</body>
</html>
